name: CI

on:
  push:
  pull_request:

# A push to a branch that already has a run in flight supersedes it. Six jobs
# run on every push and the regression suite alone is tens of minutes, so
# without this a branch pushed three times in ten minutes has three full
# matrices racing and two of them are answering a question nobody is asking
# any more. Never cancels a run on the default branch, where the answer is the
# record rather than feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The default is six hours. Nothing here is healthy at one, and a job that
    # hangs should say so while somebody is still waiting for it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regression tests
        run: node tools/test.js
      - name: Calibration bands
        run: node tools/validate.js 20
      # Every band scales with the seed count, so the documented low-seed
      # invocation has to pass too — it used to fail on sampling noise alone,
      # which is how a developer learns to ignore the harness.
      - name: Calibration bands (low seed count)
        run: node tools/validate.js 4
      # The seeds-and-fingerprints export design rests on one property — a
      # chain replays into the same world — and nothing guarded it.
      - name: Universe determinism, idempotency and round trip
        run: node tools/universe.js
      - name: Staged-pipeline timings
        run: node tools/bench.js 5
      # The uploaded artifact existed so a human could diff two runs by hand,
      # which is a comparison nobody performs. The committed baseline makes
      # the harness do it: every row that has moved by more than 5% of its own
      # band is printed, which is what catches a slow drift INSIDE a band —
      # the failure mode a pass/fail check cannot see, and the one that let a
      # re-fitted efficiency anchor slide back onto its floor unremarked.
      # Regenerate deliberately with `node tools/validate.js 20 --write-baseline`;
      # the diff in that commit is then the record of what a re-fit cost.
      - name: Calibration drift against the committed baseline
        if: always()
        run: node tools/validate.js 20 --baseline
      - name: Calibration report (JSON, for diffing across runs)
        if: always()
        run: node tools/validate.js 20 --json > calibration.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration
          path: calibration.json

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The UI had no automated coverage at all, so a CSS rule that swallowed
      # every click shipped silently.
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node tools/uismoke.js
